version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - todo-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/todo-app
      - JWT_SECRET=supersecretjwtkey
    depends_on:
      - mongo
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - todo-network

  frontend:
    build:
      context: ./Frontend/frontend
      dockerfile: ../Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Frontend/frontend:/app
      - /app/node_modules
    networks:
      - todo-network

volumes:
  mongo-data:

networks:
  todo-network:
    driver: bridge
