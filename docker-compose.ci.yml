version: '3.8'

services:
  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/todo-app
      - JWT_SECRET=supersecretjwtkey
    depends_on:
      - mongo

  frontend:
    build:
      context: ./Frontend/frontend
      dockerfile: ../Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
