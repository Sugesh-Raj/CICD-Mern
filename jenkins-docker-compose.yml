version: '3.8'

services:
  jenkins:
    build:
      context: ./jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      # Mount the Docker socket so Jenkins can use the host's Docker engine
      - /var/run/docker.sock:/var/run/docker.sock
    restart: on-failure

volumes:
  jenkins_data:
